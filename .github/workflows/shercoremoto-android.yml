# ShercoRemoto: Android build (one APK for arm64-v8a + armeabi-v7a), signed with our key.
# Based on build-rustdesk-android in the upstream flutter-build.yml.
name: Build ShercoRemoto for Android

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "flutter/lib/**"
      - "flutter/android/**"
      - "flutter/pubspec.*"
      - "src/**"
      - "libs/**"
      - "Cargo.*"
      - ".github/workflows/shercoremoto-android.yml"

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  TAG_NAME: "shercoremoto-android"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  ANDROID_KEY_STORE_PASSWORD: "${{ secrets.ANDROID_KEY_STORE_PASSWORD }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: build ShercoRemoto android apk
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
               libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
               libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: shercoremoto-android
          key: arm64-armv7

      - name: Build rustdesk lib
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          # vcpkg manifest installs replace the previous triplet, so build each ABI right after its deps
          for abi in arm64-v8a armeabi-v7a; do
            if ! ./flutter/build_android_deps.sh "$abi"; then
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
                echo "$_1:"; cat "$_1"; echo
              done
              exit 1
            fi
            if [ "$abi" = arm64-v8a ]; then ./flutter/ndk_arm64.sh; else ./flutter/ndk_arm.sh; fi
          done

      - name: Build ShercoRemoto apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Signed below with apksigner and our key
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          SYSROOT=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          JNI=./flutter/android/app/src/main/jniLibs
          mkdir -p $JNI/arm64-v8a $JNI/armeabi-v7a
          cp $SYSROOT/aarch64-linux-android/libc++_shared.so $JNI/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so $JNI/arm64-v8a/librustdesk.so
          cp $SYSROOT/arm-linux-androideabi/libc++_shared.so $JNI/armeabi-v7a/
          cp ./target/armv7-linux-androideabi/release/liblibrustdesk.so $JNI/armeabi-v7a/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm
          popd
          mkdir -p out
          mv flutter/build/app/outputs/flutter-apk/app-release.apk out/unsigned.apk

      - name: Sign apk
        if: env.ANDROID_SIGNING_KEY != ''
        shell: bash
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/shercoremoto.p12"
          "$BT/zipalign" -p -f 4 out/unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/shercoremoto.p12" --ks-type PKCS12 \
            --ks-key-alias shercoremoto --ks-pass env:ANDROID_KEY_STORE_PASSWORD --key-pass env:ANDROID_KEY_STORE_PASSWORD \
            --out out/shercoremoto-${{ env.VERSION }}-android.apk out/aligned.apk
          rm -f "$RUNNER_TEMP/shercoremoto.p12"
          "$BT/apksigner" verify --print-certs out/shercoremoto-${{ env.VERSION }}-android.apk | head -5

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shercoremoto-${{ env.VERSION }}-android.apk
          path: out/shercoremoto-${{ env.VERSION }}-android.apk

      - name: Publish signed apk package
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            out/shercoremoto-${{ env.VERSION }}-android.apk
